  <style>
    /* One-shot draw-in. Base state is the finished chart, and each animation
       ends on that same state (fill-mode: both), so the chart can never be
       left blank if animation is unsupported, disabled, or already finished. */
    .bands { opacity:1; animation:bandsIn 1.1s ease-out .15s both; }
    .ln    { stroke-dasharray:315; stroke-dashoffset:0;
             animation:draw 1.5s ease-out .25s both; }
    .flag  { opacity:1; animation:pop .45s ease-out 1.55s both; }
    @keyframes bandsIn { from{opacity:0} to{opacity:1} }
    @keyframes draw    { from{stroke-dashoffset:315} to{stroke-dashoffset:0} }
    @keyframes pop     { from{opacity:0} to{opacity:1} }
    @media (prefers-reduced-motion:reduce){
      .bands,.ln,.flag { animation:none !important; }
    }
  </style>
